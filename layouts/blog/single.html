{{ define "main" }}
<article class="blog-post">
    <header class="post-header">
        <div class="post-meta">
            <time datetime="{{ .Date.Format " 2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
        </div>
        <h1 class="post-title">{{ .Title }}</h1>
        {{ if .Description }}
        <p class="post-subtitle">{{ .Description }}</p>
        {{ end }}
    </header>

    <div class="post-content">
        {{ .Content }}
    </div>

    <footer class="post-footer">
        <nav class="post-nav">
            <a href="/blog/" class="back-to-blog">← Back to Blog</a>
        </nav>
    </footer>
</article>

<style>
    .blog-post {
        max-width: 800px;
        margin: 0 auto;
        padding: 0 1rem;
    }

    .post-header {
        text-align: center;
        margin-bottom: 3rem;
        padding-bottom: 2rem;
        border-bottom: 1px solid var(--border);
    }

    .post-meta {
        font-size: 0.9rem;
        color: var(--text-secondary);
        margin-bottom: 1rem;
    }

    .post-title {
        margin: 0 0 1rem 0;
        font-size: 2.5rem;
        line-height: 1.2;
        color: var(--text-primary);
    }

    .post-subtitle {
        font-size: 1.2rem;
        color: var(--text-secondary);
        margin: 0;
        font-style: italic;
    }

    .post-content {
        line-height: 1.7;
        font-size: 1.1rem;
    }

    .post-content h2 {
        margin: 2.5rem 0 1rem 0;
        color: var(--text-primary);
    }

    .post-content h3 {
        margin: 2rem 0 0.5rem 0;
        color: var(--text-primary);
    }

    .post-content p {
        margin: 1rem 0;
    }

    .post-content ul,
    .post-content ol {
        margin: 1rem 0;
        padding-left: 2rem;
    }

    .post-content blockquote {
        margin: 2rem 0;
        padding: 1rem 2rem;
        background: var(--bg-secondary);
        border-left: 4px solid var(--accent);
        font-style: italic;
    }

    .post-footer {
        margin-top: 3rem;
        padding-top: 2rem;
        border-top: 1px solid var(--border);
    }

    .back-to-blog {
        display: inline-block;
        color: var(--accent);
        text-decoration: none;
        font-weight: 500;
        transition: opacity 0.3s ease;
    }

    .back-to-blog:hover {
        opacity: 0.8;
    }

    @media (max-width: 768px) {
        .post-title {
            font-size: 2rem;
        }

        .post-content {
            font-size: 1rem;
        }
    }
</style>
{{ end }}
